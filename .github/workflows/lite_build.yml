name: Build APK for ZN M2 & x86_64 (ImmortalWrt)

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
  
permissions:
  contents: write
  
env:
  PACKAGE_NAME: luci-app-xray
  CACHE_DIR: ~/cache

jobs:
  release:
    name: Build APK (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ZN M2 (qualcommax/ipq60xx) - ImmortalWrt SNAPSHOT (APK)
          - id: immortalwrt-ipq60xx
            arch: aarch64_cortex-a53
            base_url: https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx
          # x86_64 - ImmortalWrt SNAPSHOT (APK)
          - id: immortalwrt-x86_64
            arch: x86_64
            base_url: https://downloads.immortalwrt.org/snapshots/targets/x86/64

    env:
      CCACHE_DIR: ~/.ccache
      CONFIG_CCACHE: y

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies & UPX
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y ccache gettext libncurses5-dev xsltproc zstd upx-ucl curl

      - name: Download & Extract ImmortalWrt SDK
        run: |
          SDK_HOME=$(mktemp -d)
          echo "SDK_HOME=$SDK_HOME" >> $GITHUB_ENV
          
          BASE_URL="${{ matrix.base_url }}"
          echo "Fetching sha256sums from ${BASE_URL}..."
          curl -sL "${BASE_URL}/sha256sums" -o sha256sums
          
          # 動態匹配包含 -sdk- 的完整檔案名稱 (支持 .tar.xz / .tar.zst)
          SDK_FILE=$(grep -oE "immortalwrt-sdk-[^ ]+\.tar\.(xz|zst)" sha256sums | head -n 1)
          if [ -z "$SDK_FILE" ]; then
            # 若 ImmortalWrt 命名格式不同，降級搜尋 openwrt-sdk
            SDK_FILE=$(grep -oE "openwrt-sdk-[^ ]+\.tar\.(xz|zst)" sha256sums | head -n 1)
          fi
          
          if [ -z "$SDK_FILE" ]; then
            echo "::error::Cannot find SDK file in sha256sums at ${BASE_URL}"
            exit 1
          fi
          
          echo "Found SDK file: ${SDK_FILE}"
          curl -sL "${BASE_URL}/${SDK_FILE}" -o "$SDK_FILE"
          
          tar -C "$SDK_HOME" --strip-components=1 -xf "$SDK_FILE"
          rm -f "$SDK_FILE" sha256sums

      - name: Update Feeds & Prepare Packages
        run: |
          cd "$SDK_HOME"
          ./scripts/feeds update -a
          
          # 將目前倉庫 (luci-app-xray) 放入 package 目錄
          ln -s "${{ github.workspace }}" "package/$PACKAGE_NAME"
          ./scripts/feeds install -a
          
          # 清理會干擾編譯的無用套件 (避免 Docker/dockerd 報錯)
          rm -rf feeds/packages/utils/dockerd
          rm -rf feeds/packages/utils/docker
          rm -rf feeds/packages/utils/containerd
          
          # 1. 搜尋 feeds 與 package 目錄下所有的 xray-core Makefile
          XRAY_MAKEFILES=$(find . -type f -name "Makefile" -path "*/xray-core/*")
          
          # 2. 注入 UPX 瘦身指令
          for xmk in $XRAY_MAKEFILES; do
              echo "[+] 找到 xray-core Makefile: $xmk"
              if ! grep -q "upx --fast" "$xmk"; then
                  sed -i '/define Build\/Compile/a \	upx --fast $(PKG_BUILD_DIR)/xray || true' "$xmk"
                  echo "[+] 成功注入 UPX 壓縮指令！"
              fi
          done
          
      - name: Build APK Packages
        run: |
          cd "$SDK_HOME"
          make defconfig
          
          # 僅編譯 luci-app-xray 與 xray-core
          make package/${PACKAGE_NAME}/compile V=s -i || true
          make package/xray-core/compile V=s -i || true
          
          echo "=== Compiled APK Files ==="
          find "$SDK_HOME/bin/" -type f -name "*.apk" -exec ls -lh {} \;

      - name: Collect Artifacts
        run: |
          mkdir -p "${{ github.workspace }}/output"
          # 遞迴搜尋所有產出的 .apk 檔並複製出來，同時加上架構標籤
          find "$SDK_HOME/bin/" -type f -name "*.apk" | while read -r f; do
            base="$(basename "$f")"
            cp "$f" "${{ github.workspace }}/output/${base%.*}-${{ matrix.id }}.${base##*.}"
          done
          echo "=== All Output APKs ==="
          ls -lh "${{ github.workspace }}/output"

      - name: Generate Tag Name
        id: tag_gen
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v$(date +'%Y.%m.%d-%H%M')-snapshot" >> $GITHUB_OUTPUT
          fi

      - name: Release APK Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.tag_name }}
          name: "ImmortalWrt SNAPSHOT APK Release ${{ steps.tag_gen.outputs.tag_name }}"
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
