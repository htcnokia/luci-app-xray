name: Build Xray APK Packages for ImmortalWrt SNAPSHOT

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 中興 ZN M2 (qualcommax/ipq60xx) - ImmortalWrt SNAPSHOT
          - id: immortalwrt-ipq60xx
            arch: aarch64_cortex-a53
            base_url: https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx
          # x86_64 - ImmortalWrt SNAPSHOT
          - id: immortalwrt-x86_64
            arch: x86_64
            base_url: https://downloads.immortalwrt.org/snapshots/targets/x86/64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies & Tools
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl zstd upx-ucl zip xsltproc

      - name: Download & Extract ImmortalWrt SDK
        run: |
          SDK_HOME=$(mktemp -d)
          echo "SDK_HOME=$SDK_HOME" >> $GITHUB_ENV
          
          BASE_URL="${{ matrix.base_url }}"
          echo "Fetching sha256sums from ${BASE_URL}..."
          curl -sL "${BASE_URL}/sha256sums" -o sha256sums
          
          # 動態匹配 SDK 檔案 (.tar.zst 或 .tar.xz)
          SDK_FILE=$(grep -oE "(immortalwrt|openwrt)-sdk-[^ ]+\.tar\.(xz|zst)" sha256sums | head -n 1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::Cannot find SDK file in sha256sums!"
            exit 1
          fi
          
          echo "Found SDK: ${SDK_FILE}"
          curl -sL "${BASE_URL}/${SDK_FILE}" -o "$SDK_FILE"
          tar -C "$SDK_HOME" --strip-components=1 -xf "$SDK_FILE"
          rm -f "$SDK_FILE" sha256sums

      - name: Setup Feeds, GeoData & Clone Chinese i18n
        run: |
          cd "$SDK_HOME"
          
          # 1. 依照官方指南：將 luci-app-xray 加入 feeds.conf.default
          echo "src-git-full luci_app_xray https://github.com/yichya/luci-app-xray" >> feeds.conf.default
          
          # 2. 更新 feeds 列表
          ./scripts/feeds update -a
          
          # 3. 安裝 luci-app-xray、status 狀態組件及 GeoData 數據庫
          ./scripts/feeds install luci-app-xray luci-app-xray-status
          ./scripts/feeds install v2ray-geoip v2ray-geosite || ./scripts/feeds install geodata
          
          # 4. 拉取中文語言包 Repo 並安裝
          git clone -b main --depth=1 https://github.com/htcnokia/luci-i18n-xray-zh-cn package/luci-i18n-xray-zh-cn
          ./scripts/feeds install -a
          
          # 5. 清理潛在的 Docker 依賴衝突
          rm -rf feeds/packages/utils/dockerd feeds/packages/utils/docker feeds/packages/utils/containerd

          # 6. 注入 UPX 瘦身指令到 xray-core Makefile
          XRAY_MAKEFILES=$(find . -type f -name "Makefile" -path "*/xray-core/*")
          for xmk in $XRAY_MAKEFILES; do
              echo "[+] 注入 UPX 瘦身到: $xmk"
              if ! grep -q "upx --fast" "$xmk"; then
                  sed -i '/define Build\/Compile/a \	upx --fast $(PKG_BUILD_DIR)/xray || true' "$xmk"
              fi
          done

      - name: Build All APK Packages
        run: |
          cd "$SDK_HOME"
          
          # 寫入私有編譯配置 (=m 代表編譯為獨立套件包)
          echo "CONFIG_PACKAGE_xray-core=m" > .config
          echo "CONFIG_PACKAGE_luci-app-xray=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-xray-status=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-xray-zh-cn=m" >> .config
          echo "CONFIG_PACKAGE_v2ray-geoip=m" >> .config
          echo "CONFIG_PACKAGE_v2ray-geosite=m" >> .config
          
          make defconfig
          
          # 開始編譯所有目標套件
          echo "=== 開始編譯目標套件 ==="
          make package/feeds/luci_app_xray/luci-app-xray/compile V=s
          make package/luci-i18n-xray-zh-cn/compile V=s || true
          make package/feeds/packages/v2ray-geoip/compile V=s || true
          make package/feeds/packages/v2ray-geosite/compile V=s || true
          
          # 補刀二次強效 UPX 壓縮，確保二進位體積最小
          find build_dir/ staging_dir/ -type f -name "xray" -perm -111 2>/dev/null | while read -r xbin; do
              echo "[+] 補刀 UPX 壓縮: $xbin"
              upx --fast "$xbin" || true
          done
          
          echo "=== 編譯產出的所有 APK 檔案 ==="
          find bin/ -type f -name "*.apk" -exec ls -lh {} \;

      - name: Collect & Package Artifacts
        run: |
          mkdir -p "${{ github.workspace }}/output"
          
          ARCH_DIR="${{ github.workspace }}/xray-apk-${{ matrix.id }}"
          mkdir -p "$ARCH_DIR"
          
          # 收集 bin 目錄下編譯出來的所有 .apk 檔案
          find "$SDK_HOME/bin/" -type f -name "*.apk" -exec cp {} "$ARCH_DIR/" \;
          
          # 打包為完整 ZIP 壓縮檔（便於一鍵下載上傳）
          cd "${{ github.workspace }}"
          zip -r "output/xray-apk-packages-${{ matrix.id }}.zip" "xray-apk-${{ matrix.id }}"
          
          # 複製核心 APK 至 output 根目錄方便單獨下載
          find "$ARCH_DIR" -type f \( -name "luci-app-xray*.apk" -o -name "xray-core*.apk" -o -name "*zh-cn*.apk" -o -name "*geoip*.apk" -o -name "*geosite*.apk" \) | while read -r f; do
            base="$(basename "$f")"
            cp "$f" "${{ github.workspace }}/output/${base%.*}-${{ matrix.id }}.${base##*.}"
          done
          
          echo "=== 最終輸出檔案清單 ==="
          ls -lh "${{ github.workspace }}/output"

      - name: Generate Tag Name
        id: tag_gen
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v$(date +'%Y.%m.%d-%H%M')-snapshot" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.tag_name }}
          name: "ImmortalWrt SNAPSHOT Xray APK Release ${{ steps.tag_gen.outputs.tag_name }}"
          files: |
            output/*.zip
            output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
