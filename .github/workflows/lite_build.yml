name: Build APK for ZN M2 & x86_64 (ImmortalWrt)

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
  
permissions:
  contents: write
  
env:
  PACKAGE_NAME: luci-app-xray
  CACHE_DIR: ~/cache

jobs:
  release:
    name: Build APK (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ZN M2 (qualcommax/ipq60xx) - ImmortalWrt SNAPSHOT (APK)
          - id: immortalwrt-ipq60xx
            arch: aarch64_cortex-a53
            base_url: https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx
          # x86_64 - ImmortalWrt SNAPSHOT (APK)
          - id: immortalwrt-x86_64
            arch: x86_64
            base_url: https://downloads.immortalwrt.org/snapshots/targets/x86/64

    env:
      CCACHE_DIR: ~/.ccache
      CONFIG_CCACHE: y

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies & UPX
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y ccache gettext libncurses5-dev xsltproc zstd upx-ucl curl

      - name: Download & Extract ImmortalWrt SDK
        run: |
          SDK_HOME=$(mktemp -d)
          echo "SDK_HOME=$SDK_HOME" >> $GITHUB_ENV
          
          BASE_URL="${{ matrix.base_url }}"
          echo "Fetching sha256sums from ${BASE_URL}..."
          curl -sL "${BASE_URL}/sha256sums" -o sha256sums
          
          # 動態匹配包含 -sdk- 的完整檔案名稱 (支持 .tar.xz / .tar.zst)
          SDK_FILE=$(grep -oE "immortalwrt-sdk-[^ ]+\.tar\.(xz|zst)" sha256sums | head -n 1)
          if [ -z "$SDK_FILE" ]; then
            # 若 ImmortalWrt 命名格式不同，降級搜尋 openwrt-sdk
            SDK_FILE=$(grep -oE "openwrt-sdk-[^ ]+\.tar\.(xz|zst)" sha256sums | head -n 1)
          fi
          
          if [ -z "$SDK_FILE" ]; then
            echo "::error::Cannot find SDK file in sha256sums at ${BASE_URL}"
            exit 1
          fi
          
          echo "Found SDK file: ${SDK_FILE}"
          curl -sL "${BASE_URL}/${SDK_FILE}" -o "$SDK_FILE"
          
          tar -C "$SDK_HOME" --strip-components=1 -xf "$SDK_FILE"
          rm -f "$SDK_FILE" sha256sums

      - name: Update Feeds & Prepare Packages
        run: |
          cd "$SDK_HOME"
          
          # 1. 更新 Feeds 并清理可能冲突的同名包
          ./scripts/feeds update -a
          rm -rf feeds/luci/applications/luci-app-xray
          rm -rf feeds/packages/net/luci-app-xray
          
          # 2. 拷贝源码到 package/luci-app-xray
          rm -rf "package/$PACKAGE_NAME"
          mkdir -p "package/$PACKAGE_NAME"
          cp -r "${{ github.workspace }}"/* "package/$PACKAGE_NAME/"
          
          # 3. 检查并纠正 Makefile 嵌套路径（关键修复！）
          if [ ! -f "package/$PACKAGE_NAME/Makefile" ] && [ -f "package/$PACKAGE_NAME/applications/luci-app-xray/Makefile" ]; then
              echo "[+] 检测到子目录嵌套，正在平铺 Makefile 结构..."
              cp -r package/$PACKAGE_NAME/applications/luci-app-xray/* package/$PACKAGE_NAME/
          fi
          
          # 确认 Makefile 位置
          if [ -f "package/$PACKAGE_NAME/Makefile" ]; then
              echo "✅ 成功确认 package/$PACKAGE_NAME/Makefile 存在！"
          else
              echo "❌ 警告: package/$PACKAGE_NAME/ 目录下未找到 Makefile，请检查仓库结构！"
              ls -la "package/$PACKAGE_NAME/"
          fi
          
          # 4. 安装 Feeds & 清理 Docker 冲突
          ./scripts/feeds install -a
          rm -rf feeds/packages/utils/dockerd
          rm -rf feeds/packages/utils/docker
          rm -rf feeds/packages/utils/containerd

          # 5. 注入 UPX 瘦身到 xray-core
          XRAY_MAKEFILES=$(find . -type f -name "Makefile" -path "*/xray-core/*")
          for xmk in $XRAY_MAKEFILES; do
              echo "[+] 注入 UPX 到: $xmk"
              if ! grep -q "upx --fast" "$xmk"; then
                  sed -i '/define Build\/Compile/a \	upx --fast $(PKG_BUILD_DIR)/xray || true' "$xmk"
              fi
          done
          
      - name: Build APK Packages
        run: |
          cd "$SDK_HOME"
          
          # 1. 写入配置并刷新
          echo "CONFIG_PACKAGE_luci-app-xray=m" > .config
          echo "CONFIG_PACKAGE_xray-core=m" >> .config
          make defconfig
          
          # 2. 编译 xray-core
          echo "=== 开始编译 xray-core ==="
          make package/xray-core/compile V=s
          
          # 3. 编译 luci-app-xray
          echo "=== 开始编译 luci-app-xray ==="
          make package/$PACKAGE_NAME/compile V=s
          
          # 4. 补刀 UPX 瘦身（如果在 build_dir 找到二进位）
          find build_dir/ staging_dir/ -type f -name "xray" -perm -111 2>/dev/null | while read -r xbin; do
              echo "[+] 补刀 UPX 瘦身: $xbin"
              upx --fast "$xbin" || true
          done
          
          echo "=== 检查 SDK bin 目录下编译出的所有 APK ==="
          find bin/ -type f -name "*.apk" -exec ls -lh {} \;


      - name: Collect and Zip Artifacts
        run: |
          mkdir -p "${{ github.workspace }}/output"
          
          # 1. 建立一個臨時目錄存放當前架構的所有 apk
          ARCH_DIR="${{ github.workspace }}/xray-apk-${{ matrix.id }}"
          mkdir -p "$ARCH_DIR"
          
          # 2. 複製所有 apk 到該目錄
          find "$SDK_HOME/bin/" -type f -name "*.apk" -exec cp {} "$ARCH_DIR/" \;
          
          # 3. 將整個目錄打包成 ZIP 壓縮檔
          cd "${{ github.workspace }}"
          zip -r "output/xray-apk-packages-${{ matrix.id }}.zip" "xray-apk-${{ matrix.id }}"
          
          # 4. 同時單獨複製一份 luci-app-xray 和 xray-core 的 apk 出來 (方便想單獨下載的人)
          find "$ARCH_DIR" -type f \( -name "luci-app-xray*.apk" -o -name "xray-core*.apk" \) | while read -r f; do
            base="$(basename "$f")"
            cp "$f" "${{ github.workspace }}/output/${base%.*}-${{ matrix.id }}.${base##*.}"
          done
          
          echo "=== 最終輸出的打包檔案 ==="
          ls -lh "${{ github.workspace }}/output"

      - name: Generate Tag Name
        id: tag_gen
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v$(date +'%Y.%m.%d-%H%M')-snapshot" >> $GITHUB_OUTPUT
          fi

      - name: Release APK Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.tag_name }}
          name: "ImmortalWrt SNAPSHOT APK Release ${{ steps.tag_gen.outputs.tag_name }}"
          # 這裡只發布 zip 包和核心 apk
          files: |
            output/*.zip
            output/luci-app-xray*.apk
            output/xray-core*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
